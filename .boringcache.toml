workspace = "boringcache/benchmark-linkerd2-v2"

[adapters.docker]
tag = "linkerd2-docker-local"
metadata-hints = ["benchmark=linkerd2-web", "upstream-command=bin/docker-build-web"]
command = [
  "docker", "buildx", "build",
  "--file", "upstream/web/Dockerfile",
  "--build-arg", "LINKERD_VERSION=__SOURCE_TAG__",
  "--tag", "linkerd2-web-benchmark:local",
  "upstream",
]
