name: "Linkerd2 Docker Benchmark"
run-name: >-
  ${{ format('Benchmark {0} | {1}', (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.cache_lane == 'rolling')) && 'Rolling' || 'Fresh', github.event_name == 'push' && 'Upstream update' || github.event_name == 'schedule' && 'Weekly' || format('Manual dispatch ({0})', github.ref_name)) }}

on:
  workflow_dispatch:
    inputs:
      cache_lane:
        description: "Benchmark lane"
        required: false
        type: choice
        default: fresh
        options: [fresh, rolling]
      project_ref:
        description: "Optional exact Linkerd commit for a controlled replay."
        required: false
        type: string
        default: ""
      buildkit_image:
        description: "Optional managed BoringCache BuildKit image."
        required: false
        type: string
        default: ""
      cli_version:
        description: "Optional BoringCache CLI release tag."
        required: false
        type: string
        default: ""
      benchmark_id_suffix:
        description: "Optional suffix for isolated comparison runs."
        required: false
        type: string
        default: ""
  push:
    branches: [main]
    paths: [".gitmodules", "upstream"]
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  packages: read

jobs:
  benchmark:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: GHA
            strategy: actions-cache
          - label: BoringCache
            strategy: boringcache
    uses: ./.github/workflows/reusable-docker-buildkit-benchmark.yml
    with:
      strategy: ${{ matrix.strategy }}
      cache_lane: ${{ github.event_name == 'push' && 'rolling' || github.event_name == 'workflow_dispatch' && inputs.cache_lane || 'fresh' }}
      benchmark_id: ${{ format('linkerd2-v2{0}', inputs.benchmark_id_suffix) }}
      project_repo: linkerd/linkerd2
      project_ref: ${{ inputs.project_ref }}
      dockerfile_path: upstream/web/Dockerfile
      docker_context: upstream
      docker_build_args: |
        --build-arg
        LINKERD_VERSION=benchmark
      image_tag: linkerd2-benchmark:latest
      cli_platform: linux-amd64
      cli_version: ${{ inputs.cli_version }}
      buildkit_image: ${{ matrix.strategy == 'actions-cache' && 'mirror.gcr.io/moby/buildkit:buildx-stable-1' || inputs.buildkit_image }}
      benchmark_workspace: boringcache/benchmark-linkerd2-v2
    secrets: inherit
